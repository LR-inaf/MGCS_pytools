[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MGCS_pytools"
version = "0.3.0"
description = "A professional Python library for kinematic MCMC analysis, Voronoi CVT spatial membership, and differential reddening correction for the MGCS HST Treasury program."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Luca Rosignoli", email = "luca.rosignoli@inaf.it"}
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "astropy>=5.3.0",
    "emcee>=3.1.4",
    "corner>=2.2.2",
    "tqdm>=4.65.0",
    "seaborn>=0.12.0",
    "h5py>=3.8.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
numba = [
    "numba>=0.59.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.urls]
"Homepage" = "https://github.com/LR-inaf/MGCS_pytools"
"Bug Tracker" = "https://github.com/LR-inaf/MGCS_pytools/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
